name: Publish v0.1.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.1.1.yml"

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "28.2.13676358"
  RELEASE_TAG: "v0.1.1"
  RELEASE_TARGET: "c76a060c418c7bb6cbda085c52421282002e95ad"

jobs:
  release:
    name: Test, build and publish v0.1.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out release target
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TARGET }}

      - name: Verify release target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET"

      - name: Run host tests
        run: make host-test

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Configure Android NDK path
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path is not set}}"
          echo "ANDROID_NDK_HOME=${sdk_root}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set module version
        run: ./scripts/set-module-version.sh "$RELEASE_TAG"

      - name: Build Android binary
        run: ./scripts/build-android.sh

      - name: Package module
        id: package
        shell: bash
        run: |
          ./scripts/package.sh
          asset="dist/ksu-smart-charge-control-${RELEASE_TAG}.zip"
          mv dist/charge-policy.zip "$asset"
          (
            cd dist
            sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256"
          )
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=${asset}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tagged_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)
            test "$tagged_sha" = "$RELEASE_TARGET"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$RELEASE_TARGET" >/dev/null
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ksu-smart-charge-control-${{ env.RELEASE_TAG }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" "$CHECKSUM" \
              --verify-tag \
              --generate-notes \
              --title "KSU Smart Charge Control ${RELEASE_TAG}"
          fi
